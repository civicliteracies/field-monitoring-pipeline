# The topic list: CLI's topics, each marked primary (a field CLI works in to win revenue) or
# secondary (watched for intelligence), with the words that also count for it. A phrase counts as a
# whole phrase, ignoring case, reading a hyphen (the non-breaking hyphen too) as a space and a run
# of spacing as one space.
# Before a call is read, the topic check gives it its topics: every topic its source names in
# config/sources.toml, and every topic a phrase of this list names in the call's title and call
# title, or in two different phrases that are not weak, standing within ten words of each other in
# its description. A call with no topic is set aside: it gets no card, and its row in the log says
# why: what its titles gave, and that its description held no two such phrases near each other. A
# card keeps the topics and marks of the day it was made; a change here reaches later calls only.
# The morning's reading stops when a topic a source names is not on this list, when one of the four
# lists below is missing, when a weak word is not a phrase of this list, or when a name not matched
# is not a topic's name.

# A weak word counts in a call's title and call title only; in the description it never counts.
weak_words = [
    "civil society organizations",
    "civil society organisations",
    "civil society groups",
    "responsible AI",
    "responsible artificial intelligence",
    "AI policy",
    "AI policies",
    "accountability",
    "public procurement",
    "access to information",
    "democratic",
]
# A name that cancels a match: it is taken out of the text before matching wherever it appears, a
# longer form such as a plural included, so no phrase inside it counts.
cancelling_names = ["democratic republic", "global citizen"]
# A title that names another sector cancels the matches in the title and call title, unless the
# title itself holds a phrase of this list outside a cancelling name.
other_sectors = [
    "police", "crime", "criminal", "terrorism", "terrorist", "disaster", "remembrance", "holocaust",
    "heritage", "malaria", "tuberculosis", "hiv", "vaccine", "vaccines", "disease", "diseases",
    "maternal", "nutrition", "agriculture", "agricultural", "farmers", "fisheries", "climate",
    "water", "energy", "transport", "tourism",
]
# A topic's name that is never matched as a phrase on its own; its words still count.
names_not_matched = ["governance"]

