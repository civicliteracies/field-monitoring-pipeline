# =============================================================================
# Field Monitoring Pipeline — Task Runner
# =============================================================================
#
# SETUP    setup, install
# QUALITY  verify (the gate), check, lint, format, typecheck, test

[settings]
python.uv_venv_auto = true

[tools]
python = "3.13"

[tasks.setup]
description = "First-time project setup (installs deps, installs git hooks)"
run = [
    "uv sync",
    # pre-commit is consumed via `uvx` (uv tool) rather than a project
    # dependency, so contributors don't need it added to pyproject.toml.
    "uvx pre-commit install --hook-type pre-commit --hook-type pre-push --hook-type commit-msg",
]

[tasks.install]
description = "Sync dependencies (includes dev dependencies)"
run = "uv sync"

# =============================================================================
# QUALITY
# =============================================================================

[tasks.check]
description = "Quality gate: format + lint + typecheck + test. Fixes as it goes."
depends = ["format", "lint", "typecheck", "test"]

# The same four checks as `check`, with nothing fixed. A gate must report rather
# than repair, or it can pass by quietly editing the code it is judging. This is
# what the pre-push hook and the advisory Linux run both call. Nothing else
# belongs here: uv already refuses to run when the dependency files disagree, so
# there is no need to check that separately.
[tasks.verify]
description = "The gate, read-only: reports rather than fixes. What the push hook runs."
run = [
    "uv run ruff format --check .",
    "uv run ruff check .",
    "uv run basedpyright src tests",
    "uv run pytest -n auto",
]

[tasks.test]
description = "Run test suite"
run = "uv run pytest -n auto"

[tasks.lint]
description = "Lint and fix issues"
run = "uv run ruff check . --fix"

[tasks.format]
description = "Format codebase"
run = "uv run ruff format ."

[tasks.typecheck]
description = "Run type checking with basedpyright"
run = "uv run basedpyright src tests"
