[project]
name = "field-monitoring-pipeline"
version = "0.1.0"
description = "Field monitoring data pipeline."
readme = "README.md"
requires-python = ">=3.13"
# Pinned to exact versions rather than ranges, so a version moves only when a
# person moves it and that change arrives as a pull request where it can be
# questioned. Constitution rule 4.
dependencies = [
    "feedparser==6.0.14",
    "httpx==0.28.1",
    "pydantic==2.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_monitoring_pipeline"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[dependency-groups]
# Exact versions, not ranges. A version only changes when someone changes it
# deliberately, which arrives as a pull request and gets discussed there. That
# conversation is the control, rather than a scanner run on a schedule.
dev = [
    "basedpyright==1.39.9",
    "commitizen==4.17.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.1",
]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src/field_monitoring_pipeline"]
branch = true
# Tests run in parallel, so most workers measure nothing and each one warns about
# it. That is an artefact of the parallelism rather than a real signal, and 16
# copies of it buries the output that matters. Silencing this one slug only.
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
# ADR-0004's floor. Note this measures the whole project, not only the lines
# changed in a pull request. True diff coverage needs another dependency, so
# this is the boring approximation until it proves inadequate.
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
# Ruff 0.16's expanded default ruleset (413 rules) is preview-gated in 0.16;
# enabling preview adopts it. Ruff is version-pinned in the lockfile, so the
# ruleset only shifts on a deliberate, reviewed bump.
preview = true

[tool.ruff.lint]
# Inherit Ruff 0.16's curated default ruleset (no `select` override) and layer
# on agent-oriented guardrails the default omits.
extend-select = [
    "S",    # flake8-bandit — security anti-patterns
    "ARG",  # flake8-unused-arguments — dead parameters
    "FBT",  # flake8-boolean-trap — boolean positional arguments
    "SLF",  # flake8-self — private-member access across boundaries
    "TC",   # flake8-type-checking — import-placement hygiene
    "N",    # pep8-naming
    "D100", # module docstring required - the documentation rule, enforced
    "C901", # cyclomatic complexity cap
    "BLE",  # no blind `except Exception`
    "E722", # no bare `except`
    "RET",  # flake8-return — a function must not return a value on one path
            # and fall off the end on another
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic reads a model's annotations at run time to build its validators, so
# a field's type cannot be hidden inside a type-checking block. This is Ruff's
# documented setting for that, not a workaround.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.mccabe]
# A function past this is doing too much to review in one sitting. ADR-0004.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Test code is not a security or interface surface: asserts are the point,
# fixtures carry unused params, tests reach into private members and embed
# magic values.
"tests/**" = ["S", "ARG", "SLF001", "PLR2004", "D100"]
