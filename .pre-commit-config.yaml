repos:
-   repo: local
    hooks:
    -   id: pytest
        name: Run tests with pytest
        entry: uv run pytest -n auto
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

-   repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
    -   id: commitizen
        stages: [commit-msg]

-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version — keep in lockstep with the pinned ruff in uv.lock so the
    # hook lints with the same ruleset (0.16 preview default) as `mise run lint`.
    rev: v0.16.0
    hooks:
    # Run the linter.
      - id: ruff-check
        args: [ --fix ]
        stages: [pre-commit]
    # Run the formatter.
      - id: ruff-format
        stages: [pre-commit]
