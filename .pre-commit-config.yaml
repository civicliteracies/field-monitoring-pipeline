# Every hook runs its tool from this project's own environment, at the version
# uv.lock names, so no version is written here and no hook can disagree with
# the matching `mise run` task.
repos:
-   repo: local
    hooks:
    -   id: pytest
        name: Run tests with pytest
        entry: uv run pytest -n auto
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

    -   id: commitizen
        name: Check the commit message
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]

    # Run the linter.
    -   id: ruff-check
        name: Lint with ruff
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]

    # Run the formatter.
    -   id: ruff-format
        name: Format with ruff
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]
