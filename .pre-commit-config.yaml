# Every hook runs its tool from this project's own environment, at the version
# uv.lock names, so no version is written here and no hook can disagree with
# the matching `mise run` task. The push hook does it through `mise run verify`.
repos:
-   repo: local
    hooks:
    # The push runs the gate as one mise task, so the checks it runs are defined
    # only in mise.toml. Listing them here as separate hooks would give the gate
    # a second definition that could drift from the first.
    -   id: quality-gate
        name: Run the quality gate
        entry: mise run verify
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

    -   id: commitizen
        name: Check the commit message
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]

    # Run the linter.
    -   id: ruff-check
        name: Lint with ruff
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]

    # Run the formatter.
    -   id: ruff-format
        name: Format with ruff
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]
